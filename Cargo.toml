[package]
name = "synthdoc"
version = "0.2.0"
edition = "2021"
authors = ["Dan Smith <DCSmith1423@gmail.com>"]

[lib]
name = "synthdoc"
crate-type = ["cdylib"]

[features]
default = ["pdf-typst-cli"]
pdf-typst-cli = []  # optional external dependency on typst CLI at runtime

[dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"

# Markdown + templating
pulldown-cmark = "0.10.3"
handlebars = "5"

# DOCX
docx-rs = "0.4"

# PDF (Typst source emission + temp files + process)
tempfile = "3"

# PyO3
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py39"] }
