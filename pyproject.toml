[build-system]
requires = ["maturin>=1.6,<2"]
build-backend = "maturin"

[project]
name = "docgen"
version = "0.2.0"
description = "Synthetic document generator (Markdown templates → DOCX/PDF) via Rust + PyO3"
requires-python = ">=3.9"
authors = [{ name = "DCSmith1423", email = "DCSmith1423@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Operating System :: OS Independent",
]

[tool.maturin]
# If you add Python-only source later, set python-source here (e.g., "python")
