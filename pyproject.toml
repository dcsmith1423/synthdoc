[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "docgen"                   # your Python package name
version = "0.1.0"
description = "Generate .docx from JSON schema via Rust + PyO3"
authors = [
    {name="Dan Smith", email="DCSmith1423@gmail.com"}
]
readme = "README.md"
license = "MIT"                   # or Apache-2.0, etc.
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
]